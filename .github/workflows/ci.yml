name: CI

# Gates merges to master. Pages' own build still owns deployment — this workflow does not deploy.
#   lint            workflow lint, script syntax, post/front-matter/image validation
#   og-cards        (same-repo PRs only) generates missing OG cards and commits them back
#   build-and-check strict production build, output + leak checks, internal link check
# Require `lint` and `build-and-check` in branch protection.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check scripts parse
        run: for f in scripts/*.js; do node --check "$f"; done

      - name: Validate content
        run: node scripts/validate-content.js

  og-cards:
    # Only same-repo, human-authored PRs: forks and Dependabot get a read-only token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push generated cards to the PR branch
      actions: write    # re-dispatch CI so checks attach to the new head commit
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run og

      - name: Commit generated cards back
        id: commit
        env:
          # Via env (not inline ${{ }}) so a crafted branch name can't inject shell.
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain assets/images/og _posts)" ]; then
            echo "No OG changes to commit."
            exit 0
          fi
          git config user.name 'Cimos'
          git config user.email '10230773+Cimos@users.noreply.github.com'
          git add assets/images/og _posts
          git commit -m 'Auto-generate OG cards for new posts'
          git push origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          # The bot's push starts a PR run that GitHub holds as action_required.
          # Approve it so the PR gets its required checks with no manual click.
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 12); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&status=action_required" --jq '.workflow_runs[0].id // empty')
            if [ -n "$id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              exit 0
            fi
            sleep 5
          done
          echo "::error::No held CI run found for $sha to approve"
          exit 1

  build-and-check:
    needs: og-cards
    # Skipped only when og-cards pushed a new head; the dispatched run covers that commit.
    if: ${{ !cancelled() && needs.og-cards.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Default checkout: on PRs this is the merge result, i.e. what will actually land.
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate content
        run: node scripts/validate-content.js

      - name: Build site (production, strict)
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production

      - name: Verify key outputs exist
        run: |
          for f in index.html 404.html feed.xml sitemap.xml; do
            test -s "_site/$f" || { echo "::error::Missing build output: $f"; exit 1; }
          done
          test -s _site/tags.html || test -s _site/tags/index.html || { echo "::error::Missing tags page"; exit 1; }

      - name: Verify no dev-only code in production
        run: |
          if grep -rIl --include='*.html' -e 'etfb-fab' -e '/feedback' _site; then
            echo "::error::Dev feedback widget leaked into the production build"
            exit 1
          fi
          test ! -e _site/.feedback || { echo "::error::.feedback in _site"; exit 1; }

      - name: Link check (internal)
        # --swap-urls maps absolute site URLs to local files so they are verified too.
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-missing-alt \
            --swap-urls '^https\://cimos.github.io:' \
            --checks Links,Images,Scripts
